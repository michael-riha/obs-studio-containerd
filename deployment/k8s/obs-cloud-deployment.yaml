      # - name: obs-config
      #   persistentVolumeClaim:
      #     claimName: obs-config-pvc
      # - name: obs-entrypoint
      #   persistentVolumeClaim:
      #     claimName: obs-entrypoint-pvc
      # - name: obs-scripts
      #   persistentVolumeClaim:
      #     claimName: obs-scripts-pvc
      # - name: obs-services
      #   persistentVolumeClaim:
      #     claimName: obs-services-pvc
      # - name: obs-logs
      #   persistentVolumeClaim:
      #     claimName: obs-logs-pvc
      # - name: opt-scripts
      #   persistentVolumeClaim:
      #     claimName: obs-scripts-pvc

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shaka Player Example</title>
    
    <!-- Shaka Player CDN -->
    <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.3.6/dist/shaka-player.compiled.min.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            min-height: 100vh;
        }
        
        #video-container {
            width: 85%;
            max-width: 900px;
            margin: 20px auto;
        }
        
        video {
            width: 100%;
            border-radius: 8px;
            box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.5);
        }
        
        h1 {
            margin-bottom: 30px;
            color: #e50914;
        }
        
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        
        button {
            padding: 8px 16px;
            background: #333;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        button:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <h1>Shaka Player DASH Example</h1>
    
    <div id="video-container">
        <video id="video" controls></video>
        
        <div class="controls">
            <button id="play">Play</button>
            <button id="pause">Pause</button>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', initApp);
        
        // Initialize the application
        function initApp() {
            // Install built-in polyfills to patch browser incompatibilities
            shaka.polyfill.installAll();
            
            // Check if the browser supports the shaka player
            if (!shaka.Player.isBrowserSupported()) {
                console.error('Browser not supported for Shaka Player!');
                document.getElementById('video-container').innerHTML = 
                    '<div style="color: red; text-align: center;">Sorry, your browser is not supported by Shaka Player.</div>';
                return;
            }
            
            // Initialize the player
            initPlayer();
        }
        
        // Initialize the player
        function initPlayer() {
            // Get a reference to the video element
            const video = document.getElementById('video');
            
            // Create a Shaka Player instance
            const player = new shaka.Player(video);
            
            // Listen for errors
            player.addEventListener('error', onErrorEvent);
            
            // Configure the player
            player.configure({
                streaming: {
                    // Your custom configurations here if needed
                    rebufferingGoal: 2,
                    bufferingGoal: 10
                }
            });
            
            // Try to load the manifest
            const manifestUrl = './output/dash/manifest.mpd'; // Path to your DASH manifest
            loadVideo(manifestUrl, player);
            
            // Setup UI controls
            document.getElementById('play').addEventListener('click', () => video.play());
            document.getElementById('pause').addEventListener('click', () => video.pause());
        }
        
        // Load the specified video
        function loadVideo(manifestUri, player) {
            // Try to load a manifest
            player.load(manifestUri).then(function() {
                // This runs if the load succeeded
                console.log('The video has been loaded!');
            }).catch(onError);  // onError is executed if the load fails
        }
        
        // Log any errors
        function onErrorEvent(event) {
            // Extract the error from the event
            onError(event.detail);
        }
        
        // Report errors
        function onError(error) {
            console.error('Error code', error.code, 'object', error);
            alert('Error: ' + error.message);
        }
    </script>
</body>
</html>

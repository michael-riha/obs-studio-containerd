include:
  - ./service-config/novnc-audio/compose.yaml  #with serviceB declared
services:
  # obs:
  #   image: obs-headless:latest
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #     target: production
  #   entrypoint: tail -f /dev/null
  #   volumes:
  #     - ./service-config/obs-studio/config:/root/.config/obs-studio
  #   environment:
  #     - DISPLAY=novnc:0.0
  #   ports:
  #     - 4455:4455
  #   depends_on:
  #     novnc:
  #       condition: service_healthy
  obs-builder:
    image: obs-headless:latest
    hostname: obs
    build:
      context: .
      dockerfile: Dockerfile
      # target: builder
    entrypoint: tail -f /dev/null
    volumes:
      - ./service-config/obs-studio/config:/root/.config/obs-studio
      - ./service-config/obs-studio/entrypoint.sh:/home/obs-studio/entrypoint.sh
      - ./scripts:/opt/scripts
    environment:
      - DISPLAY=novnc:0.0
    ports:
      - 5678:5678 # debugpy port for python script debugging
      - 4455:4455 # websocket port
      - 2000:2000/tcp #SRT just as fallback
      - 2000:2000/udp #SRT input port
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -v grep | grep 'obs' > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      novnc:
        condition: service_healthy
      proxy:
        condition: service_healthy
  novnc:  
    image: theasp/novnc:latest
    environment:
      # Adjust to your screen size
      - DISPLAY_WIDTH=1600
      - DISPLAY_HEIGHT=968
      - RUN_XTERM=no
      - RUN_FLUXBOX=no
    ports:
      - "8080:8080"
    healthcheck:
        test: "wget -q --spider http://localhost:8080 || exit 1"
        interval: 6s
        timeout: 1s
        retries: 5
  ffmpeg:
    image: jrottenberg/ffmpeg:7.1.1-ubuntu2404-edge
    entrypoint: tail -f /dev/null
    ports: 
      - 1936-1999:1936-1999
      - 2001-2100:2001-2100
  rtmp:
    image: jrottenberg/ffmpeg:7.1.1-ubuntu2404-edge
    # entrypoint: tail -f /dev/null
    entrypoint: bash -c /opt/rtmp/rtmp-server.sh
    volumes:
       - ./service-config/rtmp/output:/opt/rtmp/output
       - ./service-config/rtmp/rtmp-server.sh:/opt/rtmp/rtmp-server.sh
    ports: 
      - 1935:1935
    depends_on:
      obs-builder:
        condition: service_healthy
  player:
    image: nginx:1.28.0-perl
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html
      - ./service-config/rtmp/output:/usr/share/nginx/html/output
    ports:
      - 8088:80
  # frontend:
  #   image: obs-frontend:latest
  #   entrypoint: tail -f /dev/null
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #     # target: builder
  #   volumes:
  #     - ./frontend:/app/frontend
  #      # Order Matters: this creates an anonymous volume specifically for the node_modules directory inside the container.
  #     - /app/frontend/node_modules
  #   ports:
  #     - "3000:3000"  # App
  #     - "9229:9229"  # Debugging
  #   environment:
  #     - NODE_ENV=development
  #     - CHOKIDAR_USEPOLLING=true
  dive:
    image: wagoodman/dive:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 9900:9900
    environment:
      - DIVE_SOURCE=/var/run/docker.sock
    entrypoint: tail -f /dev/null
    # entrypoint: dive server --port 9900
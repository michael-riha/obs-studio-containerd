name: Deploy to Dockerhub
# TODO: fix Error: 
# works on two deployments (arm & amd): https://github.com/michael-riha/obs-studio-containerd/actions/runs/19102391301
# NOT worked on one multi-arch (arm+amd): https://github.com/michael-riha/obs-studio-containerd/actions/runs/19102391300
# on:
#   push:
#     branches:
#       # - master
#       - feat/e2e

env:
  IMAGE_NAME: obs-studio-containerd
  DOCKERHUB_USER: miriha

jobs:
  build:
    name: Build Image
    runs-on: ${{ matrix.runner }}
    # runs-on: ubuntu-24.04 # https://github.com/actions/runner-images?tab=readme-ov-file#available-images
    # from https://www.blacksmith.sh/blog/building-multi-platform-docker-images-for-arm64-in-github-actions
    strategy:
      matrix:
        platform: [amd64, arm64]
        include:
          - platform: amd64
            runner: ubuntu-24.04 # https://github.com/actions/runner-images?tab=readme-ov-file#available-images
          - platform: arm64
            runner: ubuntu-24.04-arm # https://github.com/actions/partner-runner-images?tab=readme-ov-file#available-images
    
    steps:
    - name: Check out code
      uses: actions/checkout@v2
    - name: Debug env
      run: |
        echo $AWS_DEFAULT_REGION/$DOCKER_REGISTRY/$CONTAINER_NAME/$GITHUB_RUN_ID
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ env.DOCKERHUB_USER }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Build, tag, and push image to Docker Hub
      # push all tags https://stackoverflow.com/a/56905333
      # run: |
      #   echo $DOCKERHUB_USER/$IMAGE_NAME:$GITHUB_RUN_ID
      #   docker --version
      #   docker build -t $DOCKERHUB_USER/$IMAGE_NAME:$GITHUB_RUN_ID -t $DOCKERHUB_USER/$IMAGE_NAME:latest -f Dockerfile-multistage . 
      #   docker push $DOCKERHUB_USER/$IMAGE_NAME --all-tags
      run: |
        echo $DOCKERHUB_USER/$IMAGE_NAME:$GITHUB_RUN_ID
        docker --version
        docker build --platform linux/${{ matrix.platform }} -t $DOCKERHUB_USER/$IMAGE_NAME:$GITHUB_RUN_ID -t $DOCKERHUB_USER/$IMAGE_NAME:latest-${{ matrix.platform }} -f Dockerfile-multistage . 
        docker push $DOCKERHUB_USER/$IMAGE_NAME --all-tags
